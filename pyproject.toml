[project]
name = "catena"
version = "0.1.0"
description = "Cataloging and visualizing the web of references within papal encyclicals and the Catholic tradition."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "networkx>=3.3",
    "numpy>=2.4.6",
    # networkx.spring_layout switches to a scipy-backed sparse solver above ~500
    # nodes; the corpus crossed that threshold, so scipy is now required at build.
    "scipy>=1.13",
]

[project.scripts]
catena = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # long lines are fine in tables/URLs; formatter handles the rest

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
